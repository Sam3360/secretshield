name: SecretShield

on:
  push:
  pull_request:
   workflow_dispatch:

jobs:
  secretshield:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SecretShield
        run: python -m pip install secretshield
